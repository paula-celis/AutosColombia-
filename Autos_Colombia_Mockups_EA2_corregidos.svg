<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1660" viewBox="0 0 1600 1660"><defs><linearGradient id="g" x2="1"><stop stop-color="#153650"/><stop offset="1" stop-color="#087e8b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#153650" flood-opacity=".13"/></filter></defs><rect width="1600" height="1180" fill="#f3f6f9"/><text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#153650">Autos Colombia · mockups de Iteración 2</text><text x="70" y="106" font-family="Arial" font-size="17" fill="#718391">Entradas, salidas, celdas y reglas de mensualidad · estados de error incluidos</text>
<!-- card function panels -->
<g font-family="Arial"><!-- screen 1 --><rect x="60" y="150" width="710" height="440" rx="18" fill="white" filter="url(#sh)"/><path d="M78 150h674q18 0 18 18v52H60v-52q0-18 18-18" fill="url(#g)"/><text x="90" y="192" font-size="22" fill="white" font-weight="700">Autos Colombia</text><text x="90" y="244" font-size="15" fill="#718391">Registrar entrada</text><text x="90" y="282" font-size="12" fill="#526a79" font-weight="700">PLACA *</text><rect x="90" y="294" width="300" height="48" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="106" y="324" font-size="15" fill="#9aa7af">Selecciona vehículo</text><text x="90" y="363" font-size="13" fill="#b83b4b">Selecciona un vehículo registrado.</text><text x="420" y="282" font-size="12" fill="#526a79" font-weight="700">CELDA DISPONIBLE *</text><rect x="420" y="294" width="300" height="48" rx="8" fill="#f8fafb" stroke="#cfd9df"/><text x="436" y="324" font-size="15" fill="#718391">A-01 · Carro</text><text x="90" y="405" font-size="12" fill="#526a79" font-weight="700">OPERADOR DE ENTRADA *</text><rect x="90" y="417" width="300" height="48" rx="8" fill="white" stroke="#cfd9df"/><text x="106" y="447" font-size="15" fill="#526a79">María Gómez</text><rect x="90" y="495" width="630" height="56" rx="10" fill="#fff0f1"/><text x="110" y="519" font-size="14" fill="#a93543" font-weight="700">Error · celda no compatible</text><text x="110" y="540" font-size="12" fill="#8b4c54">La celda seleccionada es para moto; el vehículo es carro.</text>
<!-- screen 2 --> <rect x="830" y="150" width="710" height="440" rx="18" fill="white" filter="url(#sh)"/><path d="M848 150h674q18 0 18 18v52H830v-52q0-18 18-18" fill="url(#g)"/><text x="860" y="192" font-size="22" fill="white" font-weight="700">Autos Colombia</text><text x="860" y="244" font-size="15" fill="#718391">Resultado de autorización</text><circle cx="1190" cy="326" r="38" fill="#fff0f1"/><text x="1178" y="337" font-size="29" fill="#b83b4b">!</text><text x="1190" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#19364d">Ingreso no autorizado</text><text x="1190" y="421" text-anchor="middle" font-size="14" fill="#718391">ABC123 · Cliente sin mensualidad vigente</text><rect x="900" y="454" width="570" height="68" rx="10" fill="#fff0f1"/><text x="920" y="482" font-size="14" fill="#a93543" font-weight="700">No tiene una mensualidad pagada y vigente.</text><text x="920" y="504" font-size="12" fill="#8b4c54">Registra o actualiza el pago antes de permitir el ingreso.</text>
<!-- screen 3 --> <rect x="60" y="640" width="710" height="440" rx="18" fill="white" filter="url(#sh)"/><path d="M78 640h674q18 0 18 18v52H60v-52q0-18 18-18" fill="url(#g)"/><text x="90" y="682" font-size="22" fill="white" font-weight="700">Autos Colombia</text><text x="90" y="734" font-size="15" fill="#718391">Gestión de celdas</text><rect x="90" y="758" width="630" height="65" rx="10" fill="#f8fafb"/><text x="112" y="786" font-size="14" fill="#19364d" font-weight="700">A-01 · Carro · Piso 1</text><text x="112" y="808" font-size="12" fill="#22764e">Disponible</text><rect x="90" y="839" width="630" height="65" rx="10" fill="#fff7eb"/><text x="112" y="867" font-size="14" fill="#19364d" font-weight="700">M-04 · Moto · Piso 1</text><text x="112" y="889" font-size="12" fill="#a35c05">Ocupada · entrada abierta</text><rect x="90" y="932" width="630" height="91" rx="10" fill="#fff0f1"/><text x="112" y="962" font-size="14" fill="#a93543" font-weight="700">Error · celda ocupada</text><text x="112" y="985" font-size="12" fill="#8b4c54">No se puede asignar una celda con otra estancia abierta.</text><text x="112" y="1007" font-size="12" fill="#8b4c54">Selecciona una celda disponible y compatible.</text>
<!-- screen 4 --> <rect x="830" y="640" width="710" height="440" rx="18" fill="white" filter="url(#sh)"/><path d="M848 640h674q18 0 18 18v52H830v-52q0-18 18-18" fill="url(#g)"/><text x="860" y="682" font-size="22" fill="white" font-weight="700">Autos Colombia</text><text x="860" y="734" font-size="15" fill="#718391">Confirmar salida · ABC123</text><rect x="880" y="766" width="610" height="238" rx="16" fill="#fff" stroke="#e2e9ee" filter="url(#sh)"/><text x="920" y="813" font-size="20" fill="#153650" font-weight="700">¿Registrar la salida?</text><text x="920" y="846" font-size="13" fill="#718391">Al confirmar, se cierra la estancia y se libera la celda.</text><text x="920" y="895" font-size="12" fill="#526a79" font-weight="700">OPERADOR DE SALIDA *</text><rect x="920" y="907" width="530" height="44" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="936" y="935" font-size="14" fill="#9aa7af">Selecciona operador</text><text x="920" y="973" font-size="12" fill="#b83b4b">Selecciona un operador activo para registrar el cierre.</text></g><g font-family="Arial"><rect x="60" y="1160" width="1480" height="410" rx="18" fill="white" filter="url(#sh)"/><text x="90" y="1205" font-size="21" fill="#153650" font-weight="700">Estados de error · campos obligatorios y celda inexistente</text><text x="90" y="1240" font-size="14" fill="#718391">La API valida los tres campos antes de intentar registrar una entrada.</text><text x="90" y="1284" font-size="12" fill="#526a79" font-weight="700">PLACA *</text><rect x="90" y="1296" width="400" height="48" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="106" y="1326" font-size="14" fill="#9aa7af">Selecciona un vehículo</text><text x="90" y="1367" font-size="12" fill="#b83b4b">La placa es obligatoria.</text><text x="90" y="1410" font-size="12" fill="#526a79" font-weight="700">CELDA *</text><rect x="90" y="1422" width="400" height="48" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="106" y="1452" font-size="14" fill="#9aa7af">Selecciona una celda</text><text x="90" y="1493" font-size="12" fill="#b83b4b">El código de celda es obligatorio.</text><text x="550" y="1284" font-size="12" fill="#526a79" font-weight="700">OPERADOR DE ENTRADA *</text><rect x="550" y="1296" width="400" height="48" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="566" y="1326" font-size="14" fill="#9aa7af">Selecciona operador</text><text x="550" y="1367" font-size="12" fill="#b83b4b">Selecciona un operador activo.</text><rect x="550" y="1410" width="400" height="92" rx="10" fill="#fff0f1"/><text x="570" y="1440" font-size="14" fill="#a93543" font-weight="700">Error · celda no encontrada</text><text x="570" y="1464" font-size="12" fill="#8b4c54">La celda no existe o está inactiva.</text><text x="570" y="1486" font-size="12" fill="#8b4c54">Verifica el código o registra una celda activa.</text><rect x="1020" y="1270" width="470" height="245" rx="14" fill="#f8fafb" stroke="#e2e9ee"/><text x="1050" y="1315" font-size="12" fill="#526a79" font-weight="700">CÓDIGO DE CELDA *</text><rect x="1050" y="1330" width="410" height="52" rx="8" fill="white" stroke="#b83b4b" stroke-width="2"/><text x="1068" y="1363" font-size="15" fill="#19364d">Z-99</text><text x="1050" y="1410" font-size="14" fill="#a93543" font-weight="700">No se puede registrar la entrada.</text><text x="1050" y="1440" font-size="12" fill="#8b4c54">La celda Z-99 no está registrada en el sistema.</text><text x="1050" y="1465" font-size="12" fill="#8b4c54">Selecciona una celda existente y disponible.</text></g><text x="70" y="1620" font-family="Arial" font-size="13" fill="#718391">Diseño conceptual para anexar a la documentación; la validación efectiva ocurre también en el backend.</text></svg>